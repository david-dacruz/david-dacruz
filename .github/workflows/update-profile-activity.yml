name: Update profile activity

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Update recent public activity
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const username = 'david-dacruz';
            const readmePath = 'README.md';
            const start = '<!--START_SECTION:activity-->';
            const end = '<!--END_SECTION:activity-->';

            const { data: events } = await github.rest.activity.listPublicEventsForUser({
              username,
              per_page: 20,
            });

            const seen = new Set();
            const items = [];

            for (const event of events) {
              const repo = event.repo?.name;
              if (!repo || seen.has(`${event.type}:${repo}`)) continue;

              let label = null;
              if (event.type === 'PushEvent') {
                const count = event.payload?.commits?.length || 1;
                label = `Pushed ${count} commit${count === 1 ? '' : 's'} to [${repo}](https://github.com/${repo})`;
              } else if (event.type === 'PullRequestEvent') {
                const action = event.payload?.action || 'updated';
                const pr = event.payload?.pull_request;
                label = `${action[0].toUpperCase() + action.slice(1)} PR [#${pr?.number}](${pr?.html_url}) in [${repo}](https://github.com/${repo})`;
              } else if (event.type === 'IssuesEvent') {
                const action = event.payload?.action || 'updated';
                const issue = event.payload?.issue;
                label = `${action[0].toUpperCase() + action.slice(1)} issue [#${issue?.number}](${issue?.html_url}) in [${repo}](https://github.com/${repo})`;
              } else if (event.type === 'CreateEvent') {
                label = `Created ${event.payload?.ref_type || 'resource'} in [${repo}](https://github.com/${repo})`;
              } else if (event.type === 'ReleaseEvent') {
                const release = event.payload?.release;
                label = `Published release [${release?.tag_name || release?.name}](${release?.html_url}) in [${repo}](https://github.com/${repo})`;
              }

              if (label) {
                seen.add(`${event.type}:${repo}`);
                items.push(`- ${label}`);
              }
              if (items.length >= 5) break;
            }

            const next = items.length
              ? items.join('\n')
              : '- No recent public activity found.';

            const readme = fs.readFileSync(readmePath, 'utf8');
            const pattern = new RegExp(`${start}[\\s\\S]*?${end}`);
            const updated = readme.replace(pattern, `${start}\n${next}\n${end}`);

            if (updated !== readme) {
              fs.writeFileSync(readmePath, updated);
            }

      - name: Commit README changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update profile activity
          file_pattern: README.md
